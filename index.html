<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Goal Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1115;
  color: #fff;
}

header {
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #161a22;
}

button {
  background: #3b82f6;
  border: none;
  padding: 10px 15px;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  background: #2563eb;
}

.container {
  padding: 20px;
}

.goal {
  background: #1b2230;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <h2>Goal Dashboard</h2>
  <button onclick="saveData()">Save Goals</button>
</header>

<div class="container">
  <button onclick="addGoal()">+ Add Goal</button>
  <div id="goalList"></div>
</div>

<script>
let goals = JSON.parse(localStorage.getItem("goals")) || [];

function render() {
  const list = document.getElementById("goalList");
  list.innerHTML = "";

  goals.forEach((g, i) => {
    const div = document.createElement("div");
    div.className = "goal";
    div.innerHTML = `
      <input value="${g.title}" onchange="updateTitle(${i}, this.value)" />
      <button onclick="deleteGoal(${i})">Delete</button>
    `;
    list.appendChild(div);
  });

  localStorage.setItem("goals", JSON.stringify(goals));
}

function addGoal() {
  const title = prompt("Goal title:");
  if (!title) return;

  goals.push({ title });
  render();
}

function updateTitle(i, value) {
  goals[i].title = value;
  render();
}

function deleteGoal(i) {
  goals.splice(i, 1);
  render();
}

function saveData() {
  const dataStr = JSON.stringify(goals, null, 2);
  const blob = new Blob([dataStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "goals-backup.json";
  a.click();

  URL.revokeObjectURL(url);
}

render();
</script>

</body>
</html>
